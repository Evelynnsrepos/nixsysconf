# Kitty (Mod+Return in niri). Alacritty stays on Mod+T with its own config.

# Noctalia colours: Noctalia writes themes/noctalia.conf, points
# current-theme.conf at it and includes it via the BEGIN_KITTY_THEME block at
# the bottom (managed by "kitten themes"; a second include here is an error)

# Animated cursor trail (as in JaKooLit's dotfiles)
cursor_trail 1
cursor_trail_decay 0.1 0.4
# 0 = trail on every cursor move, incl. typing one character (default 2 = only jumps of 2+ cells)
cursor_trail_start_threshold 0

# Maple Mono NF: rounded like the Lexend UI font, with Nerd Font icons for Starship.
# Ligatures off so what you type (==>, !=, ...) is shown exactly as typed.
font_family Maple Mono NF
disable_ligatures always
font_size 11

background_opacity 0.85

# Same shell as Alacritty; the login shell stays bash
shell /run/current-system/sw/bin/fish

# Shift+Enter sends ESC+Enter, like the Alacritty binding
map shift+enter send_text all \x1b\r

confirm_os_window_close 0
enable_audio_bell no


include themes/noctalia.conf
