palette = "noctalia"

# Rounded "pill" prompt in the style of Starship's catppuccin-powerline preset.
# Only uses colour names from the noctalia palette below, which Noctalia
# rewrites on every wallpaper change - so the prompt follows the wallpaper.
# Needs a Nerd Font (JetBrainsMono Nerd Font in Alacritty).

add_newline = true

format = """
[](mauve)\
$os\
$directory\
[](fg:mauve bg:blue)\
$git_branch\
$git_status\
[](fg:blue bg:peach)\
$nix_shell\
$python\
$rust\
$nodejs\
$golang\
$c\
[](fg:peach bg:surface2)\
$cmd_duration\
$time\
[ ](fg:surface2)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:mauve fg:text"
format = "[$symbol ]($style)"

[os.symbols]
NixOS = ""

[directory]
style = "bg:mauve fg:text bold"
format = "[$path ]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "bg:mauve fg:text"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "\U000f0219 "
"Downloads" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:blue fg:base"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:blue fg:base"
format = "[($all_status$ahead_behind )]($style)"

[nix_shell]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol $name ]($style)"

[python]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol ($version) ]($style)"

[c]
symbol = ""
style = "bg:peach fg:base"
format = "[ $symbol ($version) ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:surface2 fg:subtext1"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface2 fg:text"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# >>> NOCTALIA STARSHIP PALETTE >>>
